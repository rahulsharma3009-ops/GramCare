{% extends 'base.html' %}{% block title %}Patient Registration{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">PATIENT REGISTRATION</span><h1>Create your GramCare Health ID</h1><p>Your mobile number becomes the account recovery identity.</p></div></div><form method="post" class="form-card grid-form"><label>Full name<input name="name" required></label><label>Mobile number<input name="phone" required></label><label>Age<input type="number" name="age"></label><label>Sex<select name="sex"><option>Female</option><option>Male</option><option>Other</option></select></label><label>Village<input name="village"></label><label>District<input name="district" value="Lucknow"></label><label>Language<select name="language"><option>Hindi</option><option>English</option></select></label><label>PHC<select name="phc_id"><option value="">Not assigned yet</option>{% for p in phcs %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></label><label>Blood group<input name="blood_group"></label><label>Allergies<input name="allergies"></label><label>Known conditions<input name="conditions"></label><label>Emergency contact<input name="emergency_contact"></label><label>PIN<input type="password" name="pin" maxlength="6" required></label><div class="full-row"><button class="btn primary">Create Health ID</button></div></form>{% endblock %}
