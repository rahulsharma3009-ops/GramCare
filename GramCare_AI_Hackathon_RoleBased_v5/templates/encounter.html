{% extends 'base.html' %}{% block title %}Clinical Encounter{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">{{doctor.phc_name}}</span><h1>Clinical encounter</h1><p>{{patient.name}} · {{patient.code}}</p></div></div><form method="post" class="form-card"><div class="form-section"><h3>Patient presentation</h3><div class="grid-form"><label>Symptoms<textarea name="symptoms" required placeholder="Describe the patient's main complaints..."></textarea></label><label>Duration<input name="duration" placeholder="e.g. 3 days"></label><label>Temperature<input name="temperature" placeholder="°F"></label><label>Blood pressure<input name="bp" placeholder="120/80"></label><label>SpO₂<input name="spo2" placeholder="%"></label><label>Pulse<input name="pulse" placeholder="bpm"></label><label>Pain score<input name="pain" placeholder="0–10"></label><label>Clinical notes<textarea name="notes"></textarea></label></div></div><div class="form-section"><h3>Doctor's care plan</h3><div class="grid-form"><label>Doctor notes<textarea name="doctor_notes" required placeholder="Clinical impression, follow-up observations, prescription/referral rationale..."></textarea></label><label>Prescription<textarea name="prescription" placeholder="Medicine, dose, frequency, duration..."></textarea></label><label>Follow-up plan<textarea name="followup_plan" placeholder="What should the patient do next?"></textarea></label><label>Follow-up date<input type="date" name="followup_date"></label></div></div><button class="btn primary">Save encounter & run AI assessment</button></form>{% endblock %}
