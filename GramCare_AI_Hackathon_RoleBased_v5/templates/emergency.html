{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><div class="auth-card emergency-card"><span class="eyebrow">EMERGENCY</span><h1>Emergency SOS</h1><p>For immediate danger, also contact your local emergency service.</p><form method="post"><label>Current location<input name="location" id="location"></label><label>Reason<textarea name="reason" required></textarea></label><button class="btn danger-btn full">Record Emergency Request</button></form><button class="btn secondary full" onclick="getLocation()">Use my current location</button></div></div>{% endblock %}{% block scripts %}<script>function getLocation(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>document.getElementById('location').value=p.coords.latitude+', '+p.coords.longitude);}}</script>{% endblock %}
