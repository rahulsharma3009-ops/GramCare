{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">HEALTHCARE NETWORK</span><h1>Find a facility</h1></div></div><div class="feature-grid">{% for f in facilities %}<div class="facility-card"><span class="eyebrow">{{f.facility_type}}</span><h3>{{f.name}}</h3><p>{{f.village}}, {{f.district}}</p><p>{{f.services}}</p>{% if f.latitude %}<a class="text-link" target="_blank" href="https://www.google.com/maps/search/?api=1&query={{f.latitude}},{{f.longitude}}">Directions →</a>{% endif %}</div>{% endfor %}</div>{% endblock %}
