{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">DIGITAL MEDICAL RECORDS</span><h1>Reports</h1></div></div>{% if current_role in ['patient','doctor'] %}<form method="post" enctype="multipart/form-data" class="form-card grid-form"><label>File<input type="file" name="file" required></label><label>Category<input name="category" value="Medical Report"></label><label class="full-row">Notes<textarea name="notes"></textarea></label><button class="btn primary">Upload report</button></form>{% endif %}<div class="panel"><table><thead><tr><th>Report</th><th>Category</th><th>Uploaded</th><th></th></tr></thead><tbody>{% for r in reports %}<tr><td><b>{{r.original_name}}</b><small>{{r.notes}}</small></td><td>{{r.category}}</td><td>{{r.created_at[:16].replace('T',' ')}}</td><td><a class="mini-btn" href="{{url_for('report_file',report_id=r.id)}}">Open</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
