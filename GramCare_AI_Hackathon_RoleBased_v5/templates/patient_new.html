{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">{{doctor.phc_name}}</span><h1>Register patient</h1><p>The system generates a unique GramCare Health ID and links the account to this PHC.</p></div></div><form method="post" class="form-card grid-form"><label>Full name<input name="name" required></label><label>Mobile<input name="phone" required></label><label>Age<input name="age" type="number"></label><label>Sex<select name="sex"><option>Female</option><option>Male</option><option>Other</option></select></label><label>Village<input name="village"></label><label>District<input name="district" value="Lucknow"></label><label>Language<input name="language" value="Hindi"></label><label>Blood group<input name="blood_group"></label><label>Allergies<input name="allergies"></label><label>Known conditions<input name="conditions"></label><label>Emergency contact<input name="emergency_contact"></label><label>Patient PIN<input name="pin" value="1234" maxlength="6"></label><div class="full-row"><button class="btn primary">Create Health ID & Patient Account</button></div></form>{% endblock %}
